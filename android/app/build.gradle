plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dkc1.recomp'
    compileSdk 34
    ndkVersion '26.1.10909125'

    defaultConfig {
        applicationId 'com.dkc1.recomp'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '0.0.14-android'

        ndk {
            // 64-bit ARM only (all current phones). Keeps the build short.
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                arguments "-DDKC1_SDL2_DIR=${rootProject.projectDir}/SDL",
                          "-DCMAKE_BUILD_TYPE=Release"
            }
        }
    }

    externalNativeBuild {
        cmake {
            // Repository root CMakeLists.txt (android/app -> ../..).
            path file('../../CMakeLists.txt')
            version '3.22.1'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so the APK installs directly.
            // Fine for personal use; not for distribution.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
